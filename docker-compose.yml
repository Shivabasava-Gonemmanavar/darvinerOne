services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.mysql.example to .env.mysql and set a root password}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: workflow_hr
      MYSQL_USER: workflow_hr_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.mysql}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - workflow_hr_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  workflow_hr_mysql:
